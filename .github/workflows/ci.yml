name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      casks:
        description: List of casks to audit (comma-separated)
        required: true
      skip_install:
        description: Skip installation of casks
        required: false
        default: true
        type: boolean
      new_cask:
        description: Apply new cask audit
        required: false
        default: false
        type: boolean

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_FROM_API: 1
  HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}

concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  generate-matrix:
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
        with:
          core: false
          cask: true

      - name: Check out Pull Request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run brew config
        run: brew config

      - name: Generate CI matrix
        id: generate-matrix
        env:
          INPUT_CASKS: ${{ github.event.inputs.casks }}
          PULL_REQUEST_URL: ${{ github.event.pull_request.url }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]
          then
            # shellcheck disable=SC2086 # $INPUT_CASKS is a space-separated list of cask tokens
            brew generate-cask-ci-matrix ${{ github.event.inputs.skip_install && '--skip-install' }} ${{ github.event.inputs.new_cask && '--new' }} --casks $INPUT_CASKS
          else
            brew generate-cask-ci-matrix --url "$PULL_REQUEST_URL"
          fi

  test:
    name: ${{ matrix.name }}
    needs: generate-matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
        with:
          core: false
          cask: true
          stable: ${{ matrix.stable || false }}

      - name: Enable debug mode
        run: |
          echo 'HOMEBREW_DEBUG=1' >> "${GITHUB_ENV}"
          echo 'HOMEBREW_VERBOSE=1' >> "${GITHUB_ENV}"
        if: runner.debug

      - name: Check out Pull Request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Clean up CI machine
        if: runner.os == 'macOS' && !matrix.stable
        run: brew test-bot --cleanup --only-cleanup-before

      - name: Cache Homebrew Gems
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.runner }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.runner }}-rubygems-

      - name: Cache style cache
        if: runner.os == 'macOS' && !matrix.stable
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew/style
          key: macos-style-cache-${{ matrix.stable && 'stable-' || 'main-' }}${{ github.sha }}
          restore-keys: macos-style-cache-${{ matrix.stable && 'stable-' || 'main-' }}

      - name: Run brew config
        run: brew config

      - name: Run brew test-bot --only-tap-syntax
        id: tap-syntax
        run: brew test-bot --tap '${{ matrix.tap }}' --only-tap-syntax ${{ matrix.stable && '--stable' || '' }}
        if: always() && !matrix.cask

      - name: Run brew fetch --cask ${{ matrix.cask.token }}
        id: fetch
        run: |
          brew fetch --cask --retry --force ${{ join(matrix.fetch_args, ' ') }} '${{ matrix.cask.path }}'
        timeout-minutes: 30
        if: >
          always() &&
          contains(fromJSON('["success", "skipped"]'), steps.tap-syntax.outcome) &&
          matrix.cask

      - name: Gather cask information
        id: info
        env:
          CASK_PATH: ${{ matrix.cask.path }}
        run: brew cask-ci info "$CASK_PATH"
        if: always() && steps.fetch.outcome == 'success' && matrix.cask

      - name: Install formula dependencies
        env:
          FORMULA_DEPENDENCIES: ${{ join(fromJSON(steps.info.outputs.formula_dependencies || '[]'), ' ') }}
        run: |
          read -r -a formula_dependencies_array <<< "$FORMULA_DEPENDENCIES"
          brew install --formula "${formula_dependencies_array[@]}"
        if: ${{ always() && steps.info.outcome == 'success' && steps.info.outputs.formula_dependencies != '[]' }}
        timeout-minutes: 30

      - name: Run brew audit --cask${{ (matrix.cask && ' ') || ' --tap ' }}${{ matrix.cask.token || matrix.tap }}
        id: audit
        run: |
          audit_args=(${{ join(matrix.audit_args, ' ') }})
          filtered_args=()
          for arg in "${audit_args[@]}"; do
            if [[ "$arg" != "--signing" ]]; then
              filtered_args+=("$arg")
            fi
          done
          brew audit --cask "${filtered_args[@]}" ${{ (matrix.cask && ' ') || ' --tap ' }}'${{ matrix.cask.token || matrix.tap }}'
        timeout-minutes: 30
        if: >
          always() &&
          contains(fromJSON('["success", "skipped"]'), steps.tap-syntax.outcome) &&
          (!matrix.cask || steps.fetch.outcome == 'success') &&
          !matrix.skip_audit

      - name: Uninstall conflicting formulae
        run: |
          read -r -a formula_conflicts_array <<< "$FORMULA_CONFLICTS"
          brew uninstall --formula --force "${formula_conflicts_array[@]}"
        if: ${{ always() && steps.info.outcome == 'success' && env.FORMULA_CONFLICTS != '' }}
        timeout-minutes: 30

      - name: Uninstall conflicting casks
        run: |
          read -r -a cask_conflicts_array <<< "$CASK_CONFLICTS"
          brew uninstall --cask --force "${cask_conflicts_array[@]}"
        if: ${{ always() && steps.info.outcome == 'success' && env.CASK_CONFLICTS != '' }}
        timeout-minutes: 30

      - name: Run brew uninstall --cask --force --zap ${{ matrix.cask.token }}
        run: |
          brew uninstall --cask --force --zap '${{ matrix.cask.path }}'
        if: always() && steps.info.outcome == 'success'
        timeout-minutes: 30

      - name: Take snapshot of installed and running apps and services (macOS only)
        id: snapshot
        run: brew cask-ci snapshot
        if: always() && steps.info.outcome == 'success' && runner.os == 'macOS'

      - name: Run brew install --cask ${{ matrix.cask.token }}
        id: install
        run: brew install --cask '${{ matrix.cask.path }}'
        if: >
          always() && steps.info.outcome == 'success' &&
          fromJSON(steps.info.outputs.macos_requirement_satisfied) &&
          !matrix.skip_install
        timeout-minutes: 30

      - name: Check for missing zap paths
        run: brew cask-ci zap-check '${{ matrix.cask.path }}'
        if: >
          always() &&
          steps.install.outcome == 'success' &&
          runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 10

      - name: Run brew uninstall --cask ${{ matrix.cask.token }}
        run: brew uninstall --cask '${{ matrix.cask.path }}'
        if: always() && steps.install.outcome == 'success' && !fromJSON(steps.info.outputs.manual_installer)
        timeout-minutes: 30

      - name: Uninstall formula dependencies
        env:
          FORMULA_DEPENDENCIES: ${{ join(fromJSON(steps.info.outputs.formula_dependencies || '[]'), ' ') }}
        run: |
          read -r -a formula_dependencies_array <<< "$FORMULA_DEPENDENCIES"
          brew uninstall --formula --force "${formula_dependencies_array[@]}"
        if: ${{ always() && steps.install.outcome == 'success' && steps.info.outputs.formula_dependencies != '[]' }}
        timeout-minutes: 30

      - name: Uninstall cask dependencies
        run: |
          read -r -a cask_dependencies_array <<< "$CASK_DEPENDENCIES"
          brew uninstall --cask --force "${cask_dependencies_array[@]}"
        if: ${{ always() && steps.install.outcome == 'success' && env.CASK_DEPENDENCIES != '' }}
        timeout-minutes: 30

      # Mirrors `brew cask-ci check`, but drops entries declared in
      # `.github/cask_check_exceptions.json` from the "after" snapshot first.
      - name: Compare installed and running apps and services with snapshot (macOS only)
        env:
          CASK_PATH: ${{ matrix.cask.path }}
        run: |
          brew ruby -- - "$CASK_PATH" <<'EOF'
            require "json"
            require "cask/cask_loader"
            require "cask/ci/check"
            require "utils/github/actions"

            cask_path = ARGV.fetch(0)
            cask = Cask::CaskLoader.load(cask_path)

            exceptions_file = Pathname(ENV.fetch("GITHUB_WORKSPACE"))/".github/cask_check_exceptions.json"
            exceptions = Hash.new { |hash, key| hash[key] = [] }
            JSON.parse(exceptions_file.read).each do |token_pattern, checks|
              next unless File.fnmatch?(token_pattern, cask.token)

              checks.each { |check, patterns| exceptions[check.to_sym].concat(patterns) }
            end

            before = JSON.parse(ENV.fetch("HOMEBREW_SNAPSHOT_BEFORE", "{}"), symbolize_names: true)
            after = Cask::CI::Check.all.to_h do |name, values|
              patterns = exceptions[name]
              next [name, values] if patterns.empty?

              [name, values.grep_v(Regexp.union(patterns.map { |pattern| Regexp.new(pattern) }))]
            end

            errors = Cask::CI::Check.errors(before, after, cask:)
            errors.each do |error|
              puts GitHub::Actions::Annotation.new(:error, error, file: cask_path)
            end

            exit 1 if errors.any?
          EOF
        if: always() && steps.snapshot.outcome == 'success' && steps.install.outcome == 'success' && runner.os == 'macOS'

  conclusion:
    name: conclusion
    needs: test
    runs-on: ubuntu-slim
    if: always()
    steps:
      - name: Result
        run: ${{ needs.test.result == 'success' }}
