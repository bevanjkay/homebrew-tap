name: Triage tasks

on: pull_request_target

concurrency:
  group: "triage-${{ github.event.number }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  triage:
    environment: github_actions
    runs-on: ubuntu-latest
    steps:
      - name: Label pull request
        uses: Homebrew/actions/label-pull-requests@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        if: always()
        with:
          token: ${{ secrets.BOT_TOKEN }}
          def: |
            - label: ci-skip-install
              content: app_path
              keep_if_no_match: true

            - label: bump-cask-pr
              pr_body_content: Created with `brew bump-cask-pr`

            - label: missing description
              path: Casks/.+
              missing_content: \n  desc .+\n

            - label: missing zap
              path: Casks/.+
              missing_content: zap .+\n
