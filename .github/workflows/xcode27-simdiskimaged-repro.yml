name: xcode-27 simdiskimaged DMG repro

# Reproduces DMG attach/copy failures on the xcode-27 runner image.
# CoreSimulator's simdiskimaged re-registers a simulator runtime, then retries
# "Ejecting diskN" by BSD name; when a freshly attached DMG has reused that name,
# its attach fails or its mount point disappears during the copy.
#
# `repro` does this without Homebrew; `homebrew` runs the same steps as
# Homebrew/homebrew-cask CI (setup-homebrew, brew config, brew fetch, brew audit).

on:
  push:
    branches:
      - xcode27-simdiskimaged-repro
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label
        default: xcode-27
        type: string
      duration:
        description: Seconds after the CoreSimulator trigger to keep starting attaches
        default: "120"
        type: string
      hold:
        description: Extra idle seconds each DMG stays mounted between listing and copying
        default: "0"
        type: string
      workers:
        description: Parallel attach loops, started 5 s apart after the trigger
        default: "4"
        type: string
      dmg_url:
        description: DMG to attach in repro jobs
        default: https://github.com/openclaw/openclaw/releases/download/v2026.10.4/OpenClaw-2026.10.4.dmg
        type: string
      cask:
        description: Cask to fetch and audit in homebrew jobs
        default: openclaw
        type: string

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  repro:
    name: repro ${{ matrix.stop && 'simdiskimaged stopped' || 'control' }} ${{ matrix.attempt }}
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    strategy:
      fail-fast: false
      matrix:
        stop: [false, true]
        attempt: [1]
    env:
      DURATION: ${{ inputs.duration || '120' }}
      HOLD: ${{ inputs.hold || '0' }}
      WORKERS: ${{ inputs.workers || '4' }}
      DMG_URL: ${{ inputs.dmg_url || 'https://github.com/openclaw/openclaw/releases/download/v2026.10.4/OpenClaw-2026.10.4.dmg' }}
    steps:
      - name: Runner state
        run: |
          MON="${RUNNER_TEMP}/repro"
          echo "MON=${MON}" >> "${GITHUB_ENV}"
          mkdir -p "${MON}"
          sw_vers
          echo "ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
          csrutil status || true
          xcode-select -p
          defaults read /Library/Developer/PrivateFrameworks/CoreSimulator.framework/Resources/Info.plist CFBundleVersion || true
          pgrep -lf 'simdiskimaged|CoreSimulatorService' || echo "simdiskimaged and CoreSimulatorService not running"
          mount | grep -iE 'CoreSimulator|cryptexd' || true
          hdiutil info

      # The DMG from the Homebrew failure: APFS (a disk plus a synthesized container, the
      # names simdiskimaged guesses at), and big enough that a fresh quarantined attach
      # spends ~20 s verifying, like a real cask download.
      - name: Download DMG
        run: |
          curl -fsSL --retry 3 -o "${MON}/base.dmg" "${DMG_URL}"
          ls -l "${MON}/base.dmg"

      - name: Stop simdiskimaged
        if: matrix.stop
        run: |
          sudo launchctl disable system/com.apple.CoreSimulator.simdiskimaged || true
          sudo launchctl bootout system/com.apple.CoreSimulator.simdiskimaged || true
          sudo pkill -x simdiskimaged || true
          sleep 1
          pgrep -lf simdiskimaged || echo "simdiskimaged stopped"

      - name: Start monitors
        run: |
          # shellcheck disable=SC2024
          sudo nohup eslogger mount unmount remount exec > "${MON}/eslogger.jsonl" 2> "${MON}/eslogger.err" &
          # shellcheck disable=SC2024
          sudo nohup log stream --level debug --style compact --predicate \
            'process IN {"diskarbitrationd", "diskimages-helper", "hdiutil", "simdiskimaged", "diskimagescontroller", "diskimagesiod", "cryptexd", "CoreSimulatorService", "mobileassetd", "ditto"} OR subsystem BEGINSWITH "com.apple.DiskImages" OR (process == "kernel" AND (eventMessage CONTAINS[c] "unmount" OR eventMessage CONTAINS "repro-dmg"))' \
            > "${MON}/log.txt" 2>&1 &
          sleep 3
          cat "${MON}/eslogger.err"

      - name: Trigger CoreSimulator and attach DMGs
        run: |
          ts() { perl -MTime::HiRes=time -MPOSIX=strftime -e '$t = time; printf "%s.%03d", strftime("%H:%M:%S", localtime $t), ($t - int $t) * 1000'; }

          # Each worker attaches a fresh quarantined copy and unpacks it like Homebrew does.
          # They start after the trigger, as on Homebrew's CI (`brew config` runs first), so
          # simulator runtimes already hold the low BSD names and our attaches land on the
          # ones simdiskimaged frees during its clean-up.
          worker() {
            set +e
            local w=$1 r=0 dmg mnt unpack start plist n mp vol voldev
            while [ "${SECONDS}" -lt "${end}" ]; do
              r=$((r + 1))
              dmg="${MON}/w${w}-r${r}.dmg"
              cp -c "${MON}/base.dmg" "${dmg}"
              xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Homebrew Cask;" "${dmg}"
              mnt=$(mktemp -d "${TMPDIR:-/tmp}/repro-dmg.XXXXXX")
              unpack=$(mktemp -d)
              start=$(ts)
              if ! plist=$(hdiutil attach -plist -nobrowse -readonly -mountrandom "${mnt}" "${dmg}" 2> "${MON}/w${w}.attach.err"); then
                echo "${start} w${w} r${r}: ATTACH FAILED: $(tail -n 1 "${MON}/w${w}.attach.err")" >> "${MON}/results.txt"
              else
                vol="" voldev=""
                for n in 0 1 2 3 4 5 6 7; do
                  mp=$(echo "${plist}" | plutil -extract "system-entities.${n}.mount-point" raw -o - - 2> /dev/null) || continue
                  vol=${mp}
                  voldev=$(echo "${plist}" | plutil -extract "system-entities.${n}.dev-entry" raw -o - - 2> /dev/null)
                  break
                done
                # Same sequence as Homebrew's UnpackStrategy::Dmg::Mount: list, mkbom, ditto --bom.
                if (cd "${vol}" && find . -print0 | tr '\0' '\n' > "${MON}/w${w}.list") &&
                   mkbom -s -i "${MON}/w${w}.list" -- "${MON}/w${w}.bom" &&
                   sleep "${HOLD}" &&
                   ditto --bom "${MON}/w${w}.bom" -- "${vol}" "${unpack}" 2> "${MON}/w${w}.ditto.err"; then
                  echo "${start} w${w} r${r}: OK (${voldev})" >> "${MON}/results.txt"
                else
                  echo "${start} w${w} r${r}: COPY FAILED (${voldev}): $(tail -n 1 "${MON}/w${w}.ditto.err"); now: $(mount | grep -E "^${voldev} on" || echo "not mounted")" >> "${MON}/results.txt"
                fi
                hdiutil detach -force "${voldev:-${vol}}" > /dev/null 2>&1 || true
              fi
              rm -rf "${dmg}" "${unpack}" "${MON}/w${w}.bom" "${MON}/w${w}.list"
            done
          }

          # What `brew config` does on Homebrew's CI (and a CoreSimulator query); this
          # starts simdiskimaged, which begins its watchOS clean-up ~20 s later.
          echo "$(ts) trigger" >> "${MON}/results.txt"
          (set -x; xcodebuild -version; xcrun --find metal; xcrun simctl runtime list) > "${MON}/trigger.txt" 2>&1 &

          end=$((SECONDS + DURATION))
          for w in $(seq 1 "${WORKERS}"); do
            sleep 5
            worker "${w}" &
          done

          wait
          sort "${MON}/results.txt"
          rounds=$(grep -cE ' w[0-9]+ r[0-9]+: ' "${MON}/results.txt" || true)
          fails=$(grep -cE 'FAILED' "${MON}/results.txt" || true)
          echo "rounds=${rounds}" | tee -a "${MON}/results.txt"
          echo "failures=${fails}" | tee -a "${MON}/results.txt"

      - name: Collect results
        if: always()
        run: |
          sleep 2
          sudo pkill -x eslogger || true
          sudo pkill -f "log stream --level debug" || true
          sudo chown -R "$(id -u)" "${MON}"
          rm -f "${MON}/base.dmg"

          echo "::group::simdiskimaged at end"
          pgrep -lf 'simdiskimaged|CoreSimulatorService' || echo "simdiskimaged and CoreSimulatorService not running"
          mount | grep -iE 'CoreSimulator|cryptexd' || true
          echo "::endgroup::"

          echo "::group::trigger output"
          cat "${MON}/trigger.txt" || true
          echo "::endgroup::"

          echo "::group::simdiskimaged key events"
          grep -E 'Cryptex mounting failed|duplicate of existing image|Attempting to add image|Unmounting|Ejecting disk|blocked by dissenter|IOCTL eject|Disk unmount requested|not responding' "${MON}/log.txt" | cut -c1-300 || true
          echo "::endgroup::"

          echo "::group::eslogger unmounts"
          jq -r 'select(.event | has("unmount")) | [.time, .process.executable.path, .event.unmount.statfs.f_mntfromname, .event.unmount.statfs.f_mntonname] | @tsv' "${MON}/eslogger.jsonl" || true
          echo "::endgroup::"

          {
            echo "### repro ${{ matrix.stop && 'simdiskimaged stopped' || 'control' }} ${{ matrix.attempt }} (${ImageVersion:-unknown})"
            echo '```'
            grep -vE ': OK ' "${MON}/results.txt" || echo "no results"
            echo "disks used: $(grep -oE '/dev/disk[0-9]+' "${MON}/results.txt" | sort | uniq -c | tr '\n' ' ')"
            echo '```'
            echo '```'
            grep -E 'Cryptex mounting failed|duplicate of existing image|Attempting to add image|Ejecting disk|blocked by dissenter|IOCTL eject' "${MON}/log.txt" | cut -c1-200 | head -n 30 || echo "no simdiskimaged runtime/eject activity"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          if grep -q '^failures=0$' "${MON}/results.txt"; then
            echo "No failures"
          else
            echo "::error::DMG attach/copy failures reproduced"
            exit 1
          fi

      - name: Upload monitor files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-${{ matrix.stop && 'stopped' || 'control' }}-${{ matrix.attempt }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repro
          if-no-files-found: ignore

  homebrew:
    name: homebrew ${{ matrix.stop && 'simdiskimaged stopped' || 'control' }} ${{ matrix.attempt }}
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    strategy:
      fail-fast: false
      matrix:
        stop: [false, true]
        attempt: [1]
    env:
      CASK: ${{ inputs.cask || 'openclaw' }}
      HOMEBREW_DEVELOPER: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_FROM_API: 1
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - name: Runner state
        run: |
          MON="${RUNNER_TEMP}/repro"
          echo "MON=${MON}" >> "${GITHUB_ENV}"
          mkdir -p "${MON}"
          sw_vers
          echo "ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
          defaults read /Library/Developer/PrivateFrameworks/CoreSimulator.framework/Resources/Info.plist CFBundleVersion || true
          pgrep -lf 'simdiskimaged|CoreSimulatorService' || echo "simdiskimaged and CoreSimulatorService not running"
          mount | grep -iE 'CoreSimulator|cryptexd' || true

      # Started before setup-homebrew so whatever brings simdiskimaged back is captured.
      - name: Start monitors
        run: |
          # shellcheck disable=SC2024
          sudo nohup eslogger mount unmount remount exec > "${MON}/eslogger.jsonl" 2> "${MON}/eslogger.err" &
          # shellcheck disable=SC2024
          sudo nohup log stream --level debug --style compact --predicate \
            'process IN {"diskarbitrationd", "diskimages-helper", "hdiutil", "simdiskimaged", "diskimagescontroller", "diskimagesiod", "cryptexd", "CoreSimulatorService", "mobileassetd", "ditto"} OR subsystem BEGINSWITH "com.apple.DiskImages" OR (process == "kernel" AND (eventMessage CONTAINS[c] "unmount" OR eventMessage CONTAINS "homebrew-dmg"))' \
            > "${MON}/log.txt" 2>&1 &
          sleep 3
          cat "${MON}/eslogger.err"

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          core: false
          cask: true

      - name: Run brew config
        run: brew config

      - name: Run brew fetch
        run: brew fetch --cask --retry --force "homebrew/cask/${CASK}"

      - name: Stop simdiskimaged
        if: matrix.stop
        run: |
          pgrep -lf 'simdiskimaged|CoreSimulatorService' || true
          sudo launchctl disable system/com.apple.CoreSimulator.simdiskimaged || true
          sudo launchctl bootout system/com.apple.CoreSimulator.simdiskimaged || true
          sudo pkill -x simdiskimaged || true
          sleep 1
          pgrep -lf simdiskimaged || echo "simdiskimaged stopped"

      - name: Run brew audit
        id: audit
        run: brew audit --cask --online "homebrew/cask/${CASK}" 2>&1 | tee "${MON}/audit.txt"

      - name: Collect results
        if: always()
        env:
          AUDIT: ${{ steps.audit.outcome }}
        run: |
          sleep 2
          sudo pkill -x eslogger || true
          sudo pkill -f "log stream --level debug" || true
          sudo chown -R "$(id -u)" "${MON}"

          echo "::group::simdiskimaged at end"
          pgrep -lf 'simdiskimaged|CoreSimulatorService' || echo "simdiskimaged and CoreSimulatorService not running"
          mount | grep -iE 'CoreSimulator|cryptexd' || true
          echo "::endgroup::"

          echo "::group::who started CoreSimulatorService and simdiskimaged"
          jq -r 'select(.event.exec and ((.event.exec.target.executable.path // "") | test("CoreSimulatorService|simdiskimaged|xcodebuild|xcrun|metal"))) | [.time, .process.audit_token.pid, .process.ppid, .process.executable.path, ((.event.exec.args // []) | join(" ") | .[0:200])] | @tsv' "${MON}/eslogger.jsonl" || true
          echo "::endgroup::"

          echo "::group::simdiskimaged key events"
          grep -E 'Cryptex mounting failed|duplicate of existing image|Attempting to add image|Unmounting|Ejecting disk|blocked by dissenter|IOCTL eject|Disk unmount requested|not responding' "${MON}/log.txt" | cut -c1-300 || true
          echo "::endgroup::"

          echo "::group::eslogger unmounts"
          jq -r 'select(.event | has("unmount")) | [.time, .process.executable.path, .event.unmount.statfs.f_mntfromname, .event.unmount.statfs.f_mntonname] | @tsv' "${MON}/eslogger.jsonl" || true
          echo "::endgroup::"

          {
            echo "### homebrew ${{ matrix.stop && 'simdiskimaged stopped' || 'control' }} ${{ matrix.attempt }} (${ImageVersion:-unknown}): audit ${AUDIT}"
            echo '```'
            grep -E 'exception while auditing|attach failed|Cannot get the real path' "${MON}/audit.txt" | cut -c1-300 || echo "no DMG unpack errors in audit output"
            echo '```'
            echo '```'
            grep -E 'Cryptex mounting failed|duplicate of existing image|Attempting to add image|Ejecting disk|blocked by dissenter|IOCTL eject' "${MON}/log.txt" | cut -c1-200 | head -n 30 || echo "no simdiskimaged runtime/eject activity"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload monitor files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-${{ matrix.stop && 'stopped' || 'control' }}-${{ matrix.attempt }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repro
          if-no-files-found: ignore
